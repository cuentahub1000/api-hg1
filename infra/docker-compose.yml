# Local Postgres for api-hg only (port 5433 so it never collides with the
# content database on 5432).  docker compose -f infra/docker-compose.yml up -d
services:
  hg-postgres:
    image: postgres:16-alpine
    container_name: hg-postgres
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - "5433:5432"
    volumes:
      - hg-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  hg-postgres-data:
